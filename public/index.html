<script>if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search + location.hash)</script>

<body>
<p id="unsupported" class="quiet pad" hidden>Capcom needs a newer browser: Safari 16.4, Chrome 89 or Firefox 108 or later.</p>
<script>if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) { document.getElementById('unsupported').hidden = false; document.getElementById('boot').hidden = true }</script>
<div class="app" id="boot" data-view="list">
  <nav class="list" aria-label="Sessions">
    <header class="list-head">
      <div class="brand"><span class="station">{{station}}</span><h1>Capcom</h1></div>
      <div class="list-actions">
        <button class="icon-btn add" type="button" aria-label="Add a project or group" disabled><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="icon-btn find" type="button" aria-label="Find a session" disabled><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12.6 12.6 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <div class="sections"><p class="quiet pad">Loading sessions</p></div>
    <footer class="list-foot">
      <label><input type="checkbox" disabled> Show archived</label>
      <form method="post" action="logout"><button class="link" type="submit">Sign out</button></form>
    </footer>
  </nav>
  <main class="chat"><section class="empty"><p>Pick a session, or start a new one.</p></section></main>
</div>
<div id="root" data-home="{{home}}" data-station="{{station}}"></div>
<script type="module" src="app.js"></script>
</body>
</html>
